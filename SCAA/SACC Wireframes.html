<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SACC Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0ece4; font-family: 'Caveat', cursive; }
  .sketch-label { font-family: 'Caveat', cursive; font-size: 13px; color: #666; }
</style>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="macos-window.jsx"></script>
</head>
<body>
<script type="text/babel">

// ─── Sketch Primitives ──────────────────────────────────────────────────────

const S = {
  box: (extra={}) => ({
    border: '2px solid #222',
    borderRadius: 2,
    background: '#fff',
    ...extra,
  }),
  dashed: (extra={}) => ({
    border: '2px dashed #aaa',
    borderRadius: 2,
    background: '#fafafa',
    ...extra,
  }),
  pill: (bg='#222', color='#fff', extra={}) => ({
    background: bg, color, borderRadius: 20, padding: '3px 10px',
    fontSize: 12, fontFamily: 'Caveat', fontWeight: 700, display:'inline-block',
    border: '1.5px solid #222', ...extra,
  }),
  tab: (active=false) => ({
    padding: '5px 14px', fontSize: 13, fontFamily: 'Caveat', fontWeight: active ? 700 : 400,
    borderBottom: active ? '3px solid #222' : '3px solid transparent',
    color: active ? '#111' : '#888', cursor: 'pointer', whiteSpace:'nowrap',
  }),
  sideItem: (active=false) => ({
    padding: '7px 12px', fontSize: 13, fontFamily: 'Caveat',
    background: active ? '#222' : 'transparent', color: active ? '#fff' : '#444',
    borderRadius: 4, cursor:'pointer', marginBottom: 2, fontWeight: active ? 700 : 400,
  }),
  img: (w, h, label, bg='#e8e4de') => (
    <div style={{ width:w, height:h, background:bg, border:'2px solid #bbb',
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      borderRadius:3, flexShrink:0, position:'relative', overflow:'hidden' }}>
      {/* diagonal lines */}
      <svg width={w} height={h} style={{position:'absolute',top:0,left:0,opacity:.25}}>
        <line x1="0" y1="0" x2={w} y2={h} stroke="#888" strokeWidth="1.5"/>
        <line x1={w} y1="0" x2="0" y2={h} stroke="#888" strokeWidth="1.5"/>
      </svg>
      <span style={{fontSize:10, color:'#888', fontFamily:'Space Mono', textAlign:'center', padding:'0 4px', position:'relative', zIndex:1}}>{label}</span>
    </div>
  ),
  anno: (text, dir='right') => (
    <div style={{ position:'absolute', ...(dir==='right'?{left:'calc(100% + 8px)'}:{right:'calc(100% + 8px)'}),
      top:'50%', transform:'translateY(-50%)', whiteSpace:'nowrap',
      fontSize:11, color:'#e07b30', fontFamily:'Caveat', display:'flex', alignItems:'center', gap:4 }}>
      {dir==='left' && <span>→</span>}
      {text}
      {dir==='right' && <span>←</span>}
    </div>
  ),
};

const Divider = ({vertical, color='#ddd'}) => vertical
  ? <div style={{width:1, background:color, alignSelf:'stretch'}} />
  : <div style={{height:1, background:color, width:'100%', margin:'4px 0'}} />;

const Tag = ({children, color='#eee'}) => (
  <span style={{background:color, border:'1.5px solid #bbb', borderRadius:3,
    padding:'1px 6px', fontSize:11, fontFamily:'Caveat', marginRight:4, whiteSpace:'nowrap'}}>
    {children}
  </span>
);

const Btn = ({children, primary, small, style={}}) => (
  <button style={{
    background: primary ? '#222' : '#fff', color: primary ? '#fff' : '#222',
    border:'2px solid #222', borderRadius:3, padding: small ? '3px 10px' : '5px 14px',
    fontFamily:'Caveat', fontSize: small ? 12 : 13, fontWeight:700, cursor:'pointer', ...style
  }}>{children}</button>
);

const SearchBar = ({placeholder='Search archive...', width='100%'}) => (
  <div style={{...S.box(), display:'flex', alignItems:'center', gap:6, padding:'5px 10px', width}}>
    <span style={{fontSize:14, opacity:.5}}>⌕</span>
    <span style={{color:'#aaa', fontSize:13, fontFamily:'Caveat'}}>{placeholder}</span>
    <span style={{marginLeft:'auto', fontSize:10, color:'#bbb', fontFamily:'Space Mono'}}>⌘K</span>
  </div>
);

// ─── LAYOUT A: Three-Column ──────────────────────────────────────────────────

function LayoutA() {

          {[['▦ Archive', true],['⏱ Timeline',false],['↓ Import Queue',false],['✦ API Fetch',false]].map(([l,a])=>(

          <div style={{...S.dashed(), padding:8, fontSize:9, fontFamily:'Space Mono',
            lineHeight:1.6, color:'#555', borderRadius:4}}>
            {`{\n  "model": "AJ1",\n  "colorway": "Chicago",\n  "retail": 180,\n  "ts": "0:42"\n}`}

          <div style={{fontSize:12, fontWeight:700}}>Script Log</div>
          <div style={{...S.dashed({background:'#111', borderColor:'#333'}), padding:8,
            borderRadius:3, flex:1, minHeight:80}}>
            {['> init archive scan…','> 3 new files detected','> Vortex fetch: OK (3/3)','> renamed: 20220409_AJ1…'].map(l=>(
              <div key={l} style={{fontSize:9, fontFamily:'Space Mono', color:'#7ae', lineHeight:1.8}}>{l}</div>
            ))}
          </div>
        </div>
      </div>
    </MacWindow>
  );
}
